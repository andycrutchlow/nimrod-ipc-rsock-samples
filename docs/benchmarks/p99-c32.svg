<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530" role="img" aria-labelledby="title desc">
<title id="title">RPC p99 latency by payload</title>
<desc id="desc">Medians of five repetitions from published-baseline. 128 B: Nimrod IPC 0.945 milliseconds, gRPC Java 1.031 milliseconds, Apache Dubbo2 0.634 milliseconds; 1 KB: Nimrod IPC 0.879 milliseconds, gRPC Java 1.059 milliseconds, Apache Dubbo2 0.649 milliseconds; 10 KB: Nimrod IPC 1.145 milliseconds, gRPC Java 1.514 milliseconds, Apache Dubbo2 0.926 milliseconds; 100 KB: Nimrod IPC 13.771 milliseconds, gRPC Java 6.545 milliseconds, Apache Dubbo2 4.477 milliseconds</desc>

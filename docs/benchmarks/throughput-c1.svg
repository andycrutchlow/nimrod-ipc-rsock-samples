<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530" role="img" aria-labelledby="title desc">
<title id="title">RPC throughput by payload</title>
<desc id="desc">Medians of five repetitions from published-baseline. 128 B: Nimrod IPC 13,408.375 completed RPC/s, gRPC Java 9,171.267 completed RPC/s, Apache Dubbo2 11,356.958 completed RPC/s; 1 KB: Nimrod IPC 12,888.208 completed RPC/s, gRPC Java 9,150.333 completed RPC/s, Apache Dubbo2 11,186.192 completed RPC/s; 10 KB: Nimrod IPC 11,880.383 completed RPC/s, gRPC Java 8,424.125 completed RPC/s, Apache Dubbo2 10,219.442 completed RPC/s; 100 KB: Nimrod IPC 4,842.825 completed RPC/s, gRPC Java 4,155.417 completed RPC/s, Apache Dubbo2 5,253.717 completed RPC/s</desc>

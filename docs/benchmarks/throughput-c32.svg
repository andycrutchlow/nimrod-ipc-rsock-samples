<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530" role="img" aria-labelledby="title desc">
<title id="title">RPC throughput by payload</title>
<desc id="desc">Medians of five repetitions from published-baseline. 128 B: Nimrod IPC 76,449.250 completed RPC/s, gRPC Java 37,674.733 completed RPC/s, Apache Dubbo2 70,502.692 completed RPC/s; 1 KB: Nimrod IPC 74,263.250 completed RPC/s, gRPC Java 36,624.392 completed RPC/s, Apache Dubbo2 68,853.942 completed RPC/s; 10 KB: Nimrod IPC 60,939.475 completed RPC/s, gRPC Java 32,819.692 completed RPC/s, Apache Dubbo2 52,597.042 completed RPC/s; 100 KB: Nimrod IPC 10,961.608 completed RPC/s, gRPC Java 8,091.917 completed RPC/s, Apache Dubbo2 12,441.258 completed RPC/s</desc>
